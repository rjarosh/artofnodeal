": 30, "Link": "https://bsky.app/profile/mjfree.bsky.social/post/3mvbuenaqzq2s", "Date": "2026-09-11", "Location": "Pentagon", "Event": "9/11 Memorial / Event", "Event Category": "Memorials & Commemorations", "Location Category": "Washington D.C. Metro Area"}, {"Index": 31, "Link": "https://x.com/atrupar/status/2101036384752435270", "Date": "2026-09-18", "Location": "White House", "Event": "Press Conference / Event", "Event Category": "Press Briefings & Addresses", "Location Category": "White House Campus"}, {"Index": 32, "Link": "https://x.com/GovPressOffice/status/2104784552837460402", "Date": "2026-09-28", "Location": "White House", "Event": "Official Press Briefing / Event", "Event Category": "Press Briefings & Addresses", "Location Category": "White House Campus"}];

const LOC = [ // order as in the original chart
 {key:"Domestic Travel (U.S. Cities & Resorts)",label:"Domestic Trips",color:"#3d6a9a"},
 {key:"International / Foreign Trips",label:"International / Foreign Trips",color:"#f0932b"},
 {key:"Washington D.C. Metro Area",label:"Other Washington D.C.",color:"#e8434d"},
 {key:"White House Campus",label:"White House",color:"#4aa9b0"}];
const EVT = [
 {key:"Press Briefings & Addresses",color:"#fcb5a3"},
 {key:"Policy, Summits & Announcements",color:"#ee444f"},
 {key:"Diplomatic, Faith & Governance",color:"#46709f"},
 {key:"Memorials & Commemorations",color:"#90b1d9"},
 {key:"Social, Sports & Cultural Events",color:"#9c7560"}];
const locBy = Object.fromEntries(LOC.map(d=>[d.key,d])), evtBy = Object.fromEntries(EVT.map(d=>[d.key,d]));
const parse = d3.timeParse("%Y-%m-%d"), fmt = d3.timeFormat("%b %-d, %Y");

let data = [], state = {loc:null, evt:null}, tx = d3.zoomIdentity;
const inLoc = d => !state.loc || d.loc === state.loc, inEvt = d => !state.evt || d.evt === state.evt;
const toggle = k => v => { state[k] = state[k] === v ? null : v; renderAll(); };

// ---- data: events.csv if reachable (http/GitHub Pages), else the embedded copy
d3.csv("sleep_events.csv").catch(() => EMBEDDED).then(rows => {
  data = rows.map(r => ({idx:+r["Index"], link:r["Link"], date:parse(r["Date"]), place:r["Location"], event:r["Event"],
    evt:r["Event Category"], loc:r["Location Category"], photo:r["Photo"] || null}))
    .sort((a,b) => a.date - b.date);
  renderAll();
  new ResizeObserver(() => drawTimeline()).observe(document.getElementById("timeline"));
});

function renderAll(){ drawBars(); drawDonut(); drawTimeline();
  const n = data.filter(d => inLoc(d) && inEvt(d)).length;
  document.getElementById("tl-title").textContent = n === data.length ? `Timeline of ${n} Naps` : `Timeline of ${n} of ${data.length} Naps`;
  document.getElementById("clear").style.visibility = (state.loc || state.evt) ? "visible" : "hidden"; }
document.getElementById("clear").onclick = () => { state = {loc:null, evt:null}; renderAll(); };

// ---- tooltip
const tip = d3.select("#tip");
function showTip(e, html){ tip.html(html).style("opacity",1); moveTip(e); }
function moveTip(e){ const w = 270, x = Math.min(e.clientX + 14, innerWidth - w), y = e.clientY + 14;
  tip.style("left", x + "px").style("top", y + "px"); }
const hideTip = () => tip.style("opacity", 0);

// ---- bar chart (counts respect the event filter)
function drawBars(){
  const W = 500, H = 340, m = {t:20,r:10,b:50,l:40};
  const counts = d3.rollup(data.filter(inEvt), v => v.length, d => d.loc);
  const x = d3.scaleBand(LOC.map(d => d.label), [m.l, W - m.r]).padding(.2);
  const y = d3.scaleLinear([0, Math.max(5, d3.max(LOC, d => counts.get(d.key) || 0))], [H - m.b, m.t]).nice();
  const svg = d3.select("#bars").selectAll("svg").data([0]).join("svg").attr("viewBox", `0 0 ${W} ${H}`);
  svg.selectAll(".axis-y").data([0]).join("g").attr("class","axis axis-y").attr("transform",`translate(${m.l},0)`)
     .call(d3.axisLeft(y).ticks(5).tickSize(-(W - m.l - m.r))).call(g => g.selectAll("line").attr("stroke","#e3e0da"));
  svg.selectAll(".axis-x").data([0]).join("g").attr("class","axis axis-x").attr("transform",`translate(0,${H - m.b})`)
     .call(d3.axisBottom(x).tickSize(0)).call(g => g.selectAll("text").call(wrap, x.bandwidth() + 10));
  const g = svg.selectAll(".bar").data(LOC, d => d.key).join("g").attr("class","bar")
     .style("opacity", d => state.loc && state.loc !== d.key ? .3 : 1).on("click", (e,d) => toggle("loc")(d.key));
  g.selectAll("rect").data(d => [d]).join("rect").attr("fill", d => d.color)
     .attr("x", d => x(d.label)).attr("width", x.bandwidth())
     .attr("y", d => y(counts.get(d.key) || 0)).attr("height", d => y(0) - y(counts.get(d.key) || 0));
  g.selectAll("text").data(d => [d]).join("text").attr("x", d => x(d.label) + x.bandwidth()/2).attr("text-anchor","middle")
     .attr("y", d => y(counts.get(d.key) || 0) - 5).attr("font-weight",400).text(d => counts.get(d.key) || 0);
}
function wrap(sel, w){ sel.each(function(){ const t = d3.select(this), words = t.text().split(/\s+/); t.text(null);
  let line = [], row = 0, ts = t.append("tspan").attr("x",0).attr("dy","1em");
  for (const word of words){ line.push(word); ts.text(line.join(" "));
    if (ts.node().getComputedTextLength() > w && line.length > 1){ line.pop(); ts.text(line.join(" ")); line = [word];
      ts = t.append("tspan").attr("x",0).attr("dy","1.1em").text(word); } } }); }

// ---- donut (counts respect the location filter); slices pop out on hover/selection and tween between states
const DR = 136, DIN = 72, POP = 14, S = 320;
const dArc = d3.arc().innerRadius(DIN).outerRadius(d => DR + (d.grow || 0));
function growTo(node, grow, dur = 200){
  if (!node || !node._cur) return;
  d3.select(node).interrupt().transition().duration(dur).ease(d3.easeCubicOut).attrTween("d", function(){
    const i = d3.interpolate(this._cur, {...this._cur, grow});
    return t => dArc(this._cur = i(t)); });
}
function drawDonut(){
  const counts = d3.rollup(data.filter(inLoc), v => v.length, d => d.evt), total = d3.sum(counts.values());
  const arcs = d3.pie().sort(null).value(d => counts.get(d.key) || 0)(EVT);
  arcs.forEach(d => d.grow = state.evt === d.data.key ? POP : 0);
  const svg = d3.select("#donut").selectAll("svg").data([0]).join("svg").attr("viewBox", `0 0 ${S} ${S}`).style("max-width","380px").style("margin","0 auto");
  const g = svg.selectAll("g.c").data([0]).join("g").attr("class","c").attr("transform",`translate(${S/2},${S/2})`);
  const paths = g.selectAll(".arc").data(arcs, d => d.data.key).join("path").attr("class","arc").attr("fill", d => d.data.color)
    .attr("stroke","#f2f0ec").attr("stroke-width",2)
    .on("click", (e,d) => toggle("evt")(d.data.key))
    .on("mouseenter", function(e,d){ growTo(this, POP); })
    .on("mousemove", (e,d) => showTip(e, `<b>${d.data.key}</b>${counts.get(d.data.key) || 0} naps`))
    .on("mouseleave", function(e,d){ growTo(this, state.evt === d.data.key ? POP : 0); hideTip(); });
  // sweep in on first draw, then morph angles / pop-out between states
  paths.interrupt().transition().duration(600).ease(d3.easeCubicOut)
    .style("opacity", d => state.evt && state.evt !== d.data.key ? .3 : 1)
    .attrTween("d", function(d){
      const from = this._cur || {startAngle:d.startAngle, endAngle:d.startAngle, grow:0};
      const i = d3.interpolate(from, {startAngle:d.startAngle, endAngle:d.endAngle, grow:d.grow});
      return t => dArc(this._cur = i(t)); });
  g.selectAll(".pct").data(arcs.filter(d => d.value / total >= .06), d => d.data.key).join("text").attr("class","pct")
    .attr("text-anchor","middle").attr("dy",".35em").attr("font-weight",400).attr("pointer-events","none")
    .attr("transform", d => `translate(${d3.arc().innerRadius(DIN).outerRadius(DR).centroid(d)})`)
    .text(d => Math.round(d.value / total * 100) + "%")
    .style("opacity", 0).transition().delay(350).duration(300).style("opacity", 1);
  g.selectAll(".tot").data([total]).join("text").attr("class","tot").attr("text-anchor","middle").attr("dy",".1em")
    .attr("font-size",34).attr("font-weight",400)
    .each(function(n){ const el = d3.select(this), i = d3.interpolateRound(this._n || 0, n); this._n = n;
      el.transition().duration(600).tween("text", () => t => el.text(i(t))); });
  g.selectAll(".totl").data([0]).join("text").attr("class","totl").attr("text-anchor","middle").attr("dy","2.4em")
    .attr("font-size",12).attr("fill","#666").text("naps");
  const nodeFor = k => paths.filter(d => d.data.key === k).node();
  d3.select("#legend").selectAll("li").data(EVT, d => d.key).join("li")
    .style("opacity", d => state.evt && state.evt !== d.key ? .35 : 1).on("click", (e,d) => toggle("evt")(d.key))
    .on("mouseenter", (e,d) => growTo(nodeFor(d.key), POP))
    .on("mouseleave", (e,d) => growTo(nodeFor(d.key), state.evt === d.key ? POP : 0))
    .html(d => `<i style="background:${d.color}"></i>${d.key}<b>${counts.get(d.key) || 0}</b>`);
}

// ---- timeline (pan / zoom on x)
const PHOTO_DIR = "sleep_icons", PHOTO_EXTS = ["jpg", "png", "webp"]; // sleep_icons/<Index>.<ext>; a Photo column in the CSV overrides this
const tlSvg = d3.select("#timeline").append("svg").style("touch-action","pan-y");
tlSvg.append("defs").append("clipPath").attr("id","mkclip").append("circle").attr("r", 16);
function loadPhoto(d, img, label){ // try each candidate; if none loads, the colored numbered circle stays
  const urls = d.photo ? [d.photo] : PHOTO_EXTS.map(e => `${PHOTO_DIR}/${d.idx}.${e}`);
  (function next(i){ if (i >= urls.length) return; const p = new Image();
    p.onload = () => { img.attr("href", urls[i]).style("display", null); label.style("display", "none"); };
    p.onerror = () => next(i + 1); p.src = urls[i]; })(0); }
let zoom;
function drawTimeline(){
  if (!data.length) return;
  const box = document.getElementById("timeline"), W = Math.max(320, box.clientWidth), H = 170, m = {l:24, r:24}, axisY = 128, my = 62, R = 17;
  tlSvg.attr("viewBox", `0 0 ${W} ${H}`);
  const base = d3.scaleTime([d3.timeDay.offset(data[0].date, -25), d3.timeDay.offset(data.at(-1).date, 25)], [m.l, W - m.r]);
  const x = tx.rescaleX(base);
  if (!zoom || zoom._w !== W){ zoom = d3.zoom().scaleExtent([1, 25]).extent([[m.l,0],[W - m.r,H]]).translateExtent([[m.l,0],[W - m.r,H]])
      .filter(e => e.type === "wheel" ? (e.ctrlKey || e.metaKey) : !e.button)
      .on("zoom", e => { tx = e.transform; drawTimeline(); hideTip(); });
    zoom._w = W; tlSvg.call(zoom); }
