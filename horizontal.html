/* =========================
   MENU
========================= */

#menu-button {
    position: fixed;
    top: 20px;
    right: 25px;
    z-index: 1000;

    color: #ffcc02;
    cursor: pointer;

#menu-panel {

    right: -260px;

/* =========================
   TIMELINE
========================= */

#chart-container {
    width: min(70vw, 1000px);
    margin: 60px auto 40px;
}

#timeline {
    position: relative;
    width: 100%;
    height: 150px;
}

#axis {
    position: absolute;
    left: 0;
    right: 0;
    top: 70px;
    height: 1px;
    background: #333;
}

.event-dot {
    position: absolute;
    top: 70px;

    border-radius: 50%;
    background: #ffcc02;
    opacity: 0.6;

    transform: translate(-50%, -50%);
    cursor: pointer;
    transition: opacity .15s ease, transform .15s ease;
}

.event-dot:hover {
    opacity: 1;
    transform: translate(-50%, -50%) scale(1.08);
}

.month-label {
    position: absolute;
    top: 88px;

    color: #999;
    font-size: 12px;
    white-space: nowrap;
}

/* =========================
   DETAILS
========================= */

    width: 50vw;
    max-width: 700px;
    margin: 30px auto;

    border: 1px solid #333;
    background: #141414;
    border-radius: 12px;

    padding: 20px;
    box-sizing: border-box;
    color: #f5f5f5;
}

#details .placeholder {

    text-align: center;
    padding: 20px 0;

#details h2 {

    color: #fffff;

    padding-bottom: 15px;

.event:last-child {
    margin-bottom: 0;
    padding-bottom: 0;

.event strong {

.quote {

   TOOLTIP
========================= */

    display: none;
    z-index: 2000;

    background: #141414;
    color: #f5f5f5;

    border: 1px solid #333;

    padding: 8px 12px;
    font-size: 14px;

    pointer-events: none;
    white-space: nowrap;
}

   MOBILE

<h1>The Art of No Deal: A Story</h1>
<p class="subtitle">
    A timeline of Trump's statements on ending the Iran war
</p>

<div id="chart-container">
    <div id="timeline">
        <div id="axis"></div>
    </div>
</div>

<div id="tooltip"></div>

<div id="details">
    <div class="placeholder">Select a day.</div>
</div>

<!-- Shared event data -->
<script src="events.js"></script>

<script>

/* =========================
   MENU
========================= */

const menuButton = document.getElementById("menu-button");
const menuPanel = document.getElementById("menu-panel");

menuButton.onclick = () => {
    menuPanel.classList.toggle("open");
};

/* =========================
   GROUP EVENTS
========================= */

const counts = {};
const byDate = {};

events.forEach(event => {

    counts[event.date] = (counts[event.date] || 0) + 1;

    if (!byDate[event.date]) {
        byDate[event.date] = [];
    }

    byDate[event.date].push(event);

});

/* =========================
   DATE RANGE
========================= */

const dates = Object.keys(counts).sort();

const firstDate = new Date(dates[0] + "T00:00:00");
const lastDate = new Date(dates[dates.length - 1] + "T00:00:00");

const totalDays = Math.round(
    (lastDate - firstDate) / (1000 * 60 * 60 * 24)
);

const timeline = document.getElementById("timeline");

function percentForDate(date) {

    const daysFromStart = Math.round(
        (date - firstDate) / (1000 * 60 * 60 * 24)
    );

    return totalDays === 0
        ? 0
        : (daysFromStart / totalDays) * 100;
}

/* =========================
   TOOLTIP HELPERS
========================= */

const tooltip = document.getElementById("tooltip");

function positionTooltip(e, percent) {

    const offset = 12;

    // Right half of the timeline -> tooltip on the left, and vice versa.
    tooltip.style.left = percent >= 50
        ? (e.clientX - tooltip.offsetWidth - offset) + "px"
        : (e.clientX + offset) + "px";

    tooltip.style.top = (e.clientY + offset) + "px";
}

/* =========================
   DRAW DOTS
========================= */

dates.forEach(iso => {

    const date = new Date(iso + "T00:00:00");
    const percent = percentForDate(date);
    const count = counts[iso];

    // 1 event = 6px, 2 events = 12px, 3 events = 18px, etc.
    const size = count * 6;

    const dot = document.createElement("div");
    dot.className = "event-dot";
    dot.style.width = size + "px";
    dot.style.height = size + "px";
    dot.style.left = percent + "%";

    dot.addEventListener("mouseenter", e => {

        tooltip.innerHTML = `
            <strong>${date.toLocaleDateString("en-US", { weekday: "long" })}</strong><br>
            ${date.toLocaleDateString("en-US", { month: "long", day: "numeric", year: "numeric" })}<br>
            ${count} quote${count === 1 ? "" : "s"}
        `;

        tooltip.style.display = "block";
        positionTooltip(e, percent);
    });

    dot.addEventListener("mousemove", e => positionTooltip(e, percent));

    dot.addEventListener("mouseleave", () => {
        tooltip.style.display = "none";
    });

    dot.addEventListener("click", () => showDetails(iso));

    timeline.appendChild(dot);

});

/* =========================
   MONTH LABELS
========================= */

const monthCursor = new Date(firstDate.getFullYear(), firstDate.getMonth(), 1);

while (monthCursor <= lastDate) {

    const label = document.createElement("div");
    label.className = "month-label";
    label.textContent = monthCursor.toLocaleDateString("en-US", { month: "short", year: "numeric" });

    const isFirstMonth =
        monthCursor.getFullYear() === firstDate.getFullYear() &&
        monthCursor.getMonth() === firstDate.getMonth();

    label.style.left = (isFirstMonth ? 0 : percentForDate(monthCursor)) + "%";

    timeline.appendChild(label);

    monthCursor.setMonth(monthCursor.getMonth() + 1);
}

/* =========================
   DETAILS
========================= */

function showDetails(date) {

    const box = document.getElementById("details");
    box.innerHTML = `<h2>${date}</h2>`;

    if (!byDate[date]) {
        box.innerHTML += "<p>No public statements</p>";
        return;
    }

    byDate[date].forEach(event => {

        box.innerHTML += `
            <div class="event">
                <strong>${event.source}</strong>
                <div class="quote">"${event.quote}"</div>
            </div>
        `;

    });

}

</script>
