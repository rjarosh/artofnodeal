<style>
* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  background: #111;
  color: #fff;
  font-family: Arial, sans-serif;
}

/* ════════════════════════════
   HEADER
════════════════════════════ */
header {
  height: 100vh;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  text-align: center;
  padding: 40px 24px;
}
header h1 {
  font-size: clamp(1.8em, 6vw, 4em);
  font-weight: bold;
  margin-bottom: 0.3em;
  line-height: 1.1;
}
header p {
  max-width: 680px;
  font-size: clamp(1em, 2.5vw, 1.25em);
  color: #aaa;
  line-height: 1.6;
}

/* ════════════════════════════
   DESKTOP TIMELINE
════════════════════════════ */
.timeline {
  position: relative;
  max-width: 900px;
  margin: 0 auto;
  padding-bottom: 120px;
}

/* center line */
.timeline::before {
  content: "";
  position: absolute;
  left: 50%;
  transform: translateX(-50%);
  width: 4px;
  top: 0;
  bottom: 0;
  background: #333;
  z-index: 0;
}

.month-marker {
  position: absolute;
  left: 50%;
  transform: translateX(-50%);
  background: #111;
  border: 1px solid #444;
  border-radius: 20px;
  padding: 4px 14px;
  font-size: 11px;
  font-weight: bold;
  color: #666;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  white-space: nowrap;
  z-index: 3;
}

/* dots sit directly in .timeline, centered on the line */
.tl-dot {
  position: absolute;
  left: 50%;
  transform: translateX(-50%);
  width: 14px;
  height: 14px;
  border-radius: 50%;
  background: #ffcc00;
  z-index: 2;
  opacity: 0;
  transition: opacity 0.4s ease 0.2s;
}
.tl-dot.visible { opacity: 1; }

.event {
  position: absolute;
  width: 42%;
  opacity: 0;
  transition: opacity 0.55s ease, transform 0.55s ease;
  z-index: 1;
}
.event.left {
  right: 53%;
  text-align: right;
  padding-right: 44px;
  transform: translateX(-36px);
}
.event.right {
  left: 53%;
  padding-left: 44px;
  transform: translateX(36px);
}
.event.visible {
  opacity: 1;
  transform: translateX(0);
}

.date {
  font-size: 0.8em;
  font-weight: bold;
  color: #ffcc00;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  margin-bottom: 8px;
}
.quote {
  font-size: 1.35em;
  line-height: 1.4;
  color: #fff;
}
.source {
  margin-top: 8px;
  font-size: 0.85em;
  color: #666;
}

/* ════════════════════════════
   DESKTOP FOOTER
════════════════════════════ */
footer {
  text-align: center;
  padding: 40px 20px 60px;
  font-size: 0.85em;
  color: #555;
  border-top: 1px solid #222;
  line-height: 2;
}
footer a {
  color: #888;
  text-decoration: none;
  border-bottom: 1px solid #444;
  transition: color 0.2s, border-color 0.2s;
}
footer a:hover { color: #ffcc00; border-color: #ffcc00; }
footer .byline { margin-bottom: 6px; color: #666; }

/* ════════════════════════════
   MOBILE — hidden by default
════════════════════════════ */
.mobile-timeline { display: none; }

@media (max-width: 640px) {
  /* hide desktop */
  .timeline { display: none; }
  footer { display: none; }

  /* The mobile container IS the scroll viewport */
  .mobile-timeline {
    display: block;
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    overflow-y: scroll;
    scroll-snap-type: y mandatory;
    -webkit-overflow-scrolling: touch;
    background: #111;
    z-index: 10;
  }

  /* vertical line running full height of scroll container

  .mobile-inner {
    position: relative;
  }
  .mobile-inner::before {
    content: "";
    position: absolute;
    left: 28px;
    top: 100vh; /* skip the header slide */
    bottom: 0;
    width: 3px;
    background: #333;
    z-index: 0;
  }

  .mobile-slide {
    position: relative;
    height: 100vh;
    display: flex;
    align-items: center;
    padding: 48px 32px 48px 64px;
    scroll-snap-align: start;
    z-index: 1;
    opacity: 0;
    transform: translateY(24px);
    transition: opacity 0.45s ease, transform 0.45s ease;
  }
  .mobile-slide.visible {
    opacity: 1;
    transform: translateY(0);
  }

  /* dot centered on the line for each slide */
  .mobile-slide::after {
    content: "";
    position: absolute;
    left: 22px;
    top: 50%;
    transform: translateY(-50%);
    width: 14px;
    height: 14px;
    border-radius: 50%;
    background: #ffcc00;
    z-index: 2;
    opacity: 0;
    transition: opacity 0.4s ease 0.25s;

  .mobile-slide.visible::after { opacity: 1; }

    line-height: 1.35;
    color: #fff;
    margin-bottom: 18px;
  }
  .mobile-slide .source {
    font-size: 0.82em;
    color: #666;
  }

  /* header slide — suppress line and dot */
  .mobile-slide--header::before { display: none; }
  .mobile-slide--header::after  { display: none; }
  .mobile-slide--header {
    flex-direction: column;
    justify-content: center;
    align-items: center;
    text-align: center;
    padding: 48px 40px;
  }

  .swipe-hint {
    position: absolute;
    bottom: 52px;
    left: 50%;
    transform: translateX(-50%);
    animation: bounce 1.8s ease-in-out infinite;
    opacity: 0.6;
  }
  @keyframes bounce {
    0%, 100% { transform: translateX(-50%) translateY(0); }

  .mobile-footer-slide {
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    scroll-snap-align: start;
    text-align: center;

     the fixed overlay handles everything */
  body { overflow: hidden; }
  header { display: none; }
}

.scroll-hint {

  bottom: 52px;
  left: 50%;
  transform: translateX(-50%);
  animation: bounce 1.8s ease-in-out infinite;
  opacity: 0.6;
}

(function() {
  const parseDate = d => new Date(d).getTime();
  const minDate = parseDate(events[0].date);
  const PX_PER_DAY = 8, MIN_GAP = 140;

  let pos = events.map(e => Math.round((parseDate(e.date) - minDate) / 86400000 * PX_PER_DAY));
  for (let i = 1; i < pos.length; i++) {
    if (pos[i] - pos[i-1] < MIN_GAP) pos[i] = pos[i-1] + MIN_GAP;
  }

  const tl = document.getElementById('tl');
  const OFFSET = 60;
  let lastMonth = null;
  const cards = [];

  events.forEach((ev, i) => {
    const top = pos[i] + OFFSET;
    const side = i % 2 === 0 ? 'left' : 'right';
    const month = ev.date.slice(0, 7);

    if (month !== lastMonth) {
      const pill = document.createElement('div');
      pill.className = 'month-marker';
      pill.style.top = (top - 28) + 'px';
      pill.textContent = new Date(ev.date + 'T12:00:00').toLocaleDateString('en-US', { month: 'long', year: 'numeric' });
      tl.appendChild(pill);
      lastMonth = month;
    }

    // dot appended directly to .timeline so it's positioned relative to the line
    const dot = document.createElement('div');
    dot.className = 'tl-dot';
    dot.style.top = (top + 2) + 'px';
    tl.appendChild(dot);

    const card = document.createElement('div');
    card.className = 'event ' + side;
    card.style.top = top + 'px';
    card.dataset.dotIndex = i;
    card.id = 'event-' + i;

    const dateStr = new Date(ev.date + 'T12:00:00').toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
    card.innerHTML = `
      <div class="date">${dateStr}</div>
      <div class="quote">"${ev.quote}"</div>
      ${ev.source ? `<div class="source">${ev.source}</div>` : ''}
    `;
    tl.appendChild(card);
    cards.push({ card, dot });
  });

  tl.style.height = (pos[pos.length - 1] + OFFSET + 250) + 'px';

  const obs = new IntersectionObserver(entries => {
    entries.forEach(entry => {
      if (entry.isIntersecting) {
        const idx = entry.target.dataset.dotIndex;
        entry.target.classList.add('visible');
        cards[idx].dot.classList.add('visible');
        obs.unobserve(entry.target);
      }
    });
  }, { threshold: 0.15 });

  cards.forEach(({ card }) => obs.observe(card));
})();

      </svg>
    </div>
  `;
  inner.appendChild(headerSlide);

  events.forEach((ev, i) => {
    const slide = document.createElement('div');
    slide.className = 'mobile-slide';
    slide.dataset.dotIndex = i;
    const dateStr = new Date(ev.date + 'T12:00:00').toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
    slide.innerHTML = `
      <div class="mobile-slide-inner">
        <div class="date">${dateStr}</div>
        <div class="quote">"${ev.quote}"</div>
        ${ev.source ? `<div class="source">${ev.source}</div>` : ''}
      </div>
    `;
    inner.appendChild(slide);
  });

  const footerSlide = document.createElement('div');
  footerSlide.className = 'mobile-footer-slide';
  footerSlide.innerHTML = `
    <div class="byline">Sources: Compiled from news reports, White House transcripts, and Truth Social. </div>
    <a href="https://shinycharts.substack.com" target="_blank">Missing something? Let me know →</a>
  `;
  inner.appendChild(footerSlide);

  // observe slides for fade-in
  const obs = new IntersectionObserver(entries => {
    entries.forEach(entry => {
      if (entry.isIntersecting) {
        entry.target.classList.add('visible');
        obs.unobserve(entry.target);
      }
    });
  }, {
    root: document.getElementById('mobile-tl'),
    threshold: 0.4
  });

  inner.querySelectorAll('.mobile-slide').forEach(s => obs.observe(s));
})();

if (location.hash) {
  const idx = location.hash.replace('#event-', '');
  const el = document.getElementById('event-' + idx);
  if (el) setTimeout(() => el.scrollIntoView({ behavior: 'smooth', block: 'center' }), 300);
  const mobileEl = document.querySelector('.mobile-slide[data-dot-index="' + idx + '"]');
  const container = document.querySelector('.mobile-timeline');
  if (mobileEl && container) setTimeout(() => container.scrollTo({ top: mobileEl.offsetTop, behavior: 'smooth' }), 300);
}
</script>

</body>
</html>
