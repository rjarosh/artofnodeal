  <title>The Art of No Deal: Keyword Search</title>

  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      margin: 0;
      padding: 40px;
      background: #0b0b0b;
      color: #f5f5f5;
    }

    h1 {
      text-align: center;
      color: #ffffff;
    }

    .subtitle {
      text-align: center;
      color: #aaa;
      font-size: 16px;
      margin-top: -10px;
      margin-bottom: 30px;
    }

    /* =========================
       MENU
    ========================= */

    #menu-button {
      position: fixed;
      top: 20px;
      right: 25px;
      z-index: 1000;
      font-size: 28px;
      color: #ffcc02;
      cursor: pointer;
      user-select: none;
    }

    #menu-panel {
      position: fixed;
      top: 0;
      right: -260px;
      width: 240px;
      height: 100vh;
      background: #141414;
      border-left: 1px solid #333;
      padding-top: 80px;
      transition: right .25s ease;
      z-index: 999;
    }

    #menu-panel.open { right: 0; }

    #menu-panel a {
      display: block;
      padding: 18px 30px;
      color: #f5f5f5;
      text-decoration: none;
      font-size: 18px;
    }

    #menu-panel a:hover { color: #ffcc02; }

    /* =========================
       SEARCH PANEL
    ========================= */

    .controls {
      width: 100%;
      max-width: 700px;
      margin: 0 auto;
    }

    label {
      display: block;
      font-weight: 600;
      margin-bottom: 8px;
    }

    input, button { font: inherit; }

    button { cursor: pointer; }

    .search-panel {
      border: 1px solid #333;
      background: #141414;
      border-radius: 12px;
      padding: 20px;
      margin: 20px auto 0;
      box-sizing: border-box;
    }

    /* ---- Multi-select dropdown ---- */

    .dropdown { position: relative; }

    .dropdown-toggle {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      padding: 10px;
      border: 1px solid #333;
      border-radius: 6px;
      background: #0b0b0b;
      color: #f5f5f5;
      text-align: left;
    }

    .dropdown-toggle:hover,
    .dropdown-toggle[aria-expanded="true"] { border-color: #ffcc02; }

    .dropdown-toggle .caret { color: #ffcc02; }

    .dropdown-menu {
      position: absolute;
      left: 0;
      right: 0;
      top: calc(100% + 4px);
      z-index: 20;
      max-height: 340px;
      overflow-y: auto;
      padding: 6px 0;
      background: #141414;
      border: 1px solid #333;
      border-radius: 6px;
      box-shadow: 0 8px 20px #000000b3;
    }

    .dropdown-menu[hidden] { display: none; }

    .dropdown-item {
      display: flex;
      align-items: center;
      gap: 10px;
      margin: 0;
      padding: 8px 12px;
      font-weight: 400;
      cursor: pointer;
    }

    .dropdown-item:hover { background: #1f1f1f; color: #ffcc02; }

    .dropdown-item input {
      width: auto;
      padding: 0;
      margin: 0;
      accent-color: #ffcc02;
    }

    .dropdown-divider {
      height: 1px;
      margin: 6px 0;
      background: #333;
    }

    /* Custom search row: checkbox + text field that looks like a label */

    .dropdown-custom-row {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 12px;
    }

    .dropdown-custom-row:hover { background: #1f1f1f; }

    .dropdown-custom-row input[type="checkbox"] {
      width: auto;
      padding: 0;
      margin: 0;
      accent-color: #ffcc02;
    }

    .dropdown-custom-row input[type="text"] {
      flex: 1;
      min-width: 0;
      padding: 0;
      border: 0;
      border-radius: 0;
      background: transparent;
      color: #f5f5f5;
    }

    .dropdown-custom-row input[type="text"]:focus {
      border: 0;
      outline: none;
    }

    .dropdown-custom-row input[type="text"]::placeholder {
      color: #ffcc02;
      opacity: 0.55;
      font-style: italic;
    }

    #search-button {
      margin-top: 14px;
      padding: 10px 20px;
      border: 0;
      border-radius: 6px;
      background: #ffcc02;
      color: #0b0b0b;
      font-weight: 700;
    }

    #search-button:hover { background: #ffd93d; }

    /* ---- Grouping control ---- */

    #toggle-grouping {
      margin-top: 16px;
      padding: 8px 12px;
      border: 1px solid #333;
      border-radius: 6px;
      background: #141414;
      color: #ffcc02;
    }

    #toggle-grouping:hover { border-color: #ffcc02; }

    .slider-control { margin-top: 16px; }

    .slider-control[hidden] { display: none; }

    
.slider-control input[type="range"] {
  width: 100%;
  padding: 0;
  margin: 8px 0;
  cursor: pointer;
  accent-color: #ffcc02;
  appearance: none;
  -webkit-appearance: none;
  background: transparent;
}

/* Visible horizontal track */
.slider-control input[type="range"]::-webkit-slider-runnable-track {
  height: 5px;
  background: #555;
  border-radius: 5px;
}

/* Yellow draggable thumb */
.slider-control input[type="range"]::-webkit-slider-thumb {
  -webkit-appearance: none;
  appearance: none;
  width: 16px;
  height: 16px;
  margin-top: -5.5px;
  border-radius: 50%;
  background: #ffcc02;
  cursor: grab;
}

/* Firefox track */
.slider-control input[type="range"]::-moz-range-track {
  height: 5px;
  background: #555;
  border-radius: 5px;
}

/* Firefox thumb */
.slider-control input[type="range"]::-moz-range-thumb {
  width: 16px;
  height: 16px;
  border: none;
  border-radius: 50%;
  background: #ffcc02;
  cursor: grab;
}


    .slider-labels {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      color: #999;
      font-size: 12px;
    }

    #result-count {
      color: #777;
      text-align: center;
      margin: 24px 0 10px;
    }

    /* =========================
       TIMELINE
    ========================= */

    #timeline-container { margin: 30px auto 40px; }

    .timeline-scroll {
      width: min(70vw, 1000px);
      margin: 30px auto 40px;
      overflow-x: auto;
      overflow-y: hidden;
    }

    .timeline {
      position: relative;
      min-width: 850px;
      height: 150px;
    }

    .timeline-line {
      position: absolute;
      left: 0;
      right: 0;
      top: 70px;
      height: 1px;
      background: #333;
    }

    .timeline-point {
      position: absolute;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0;
      border: none;
      border-radius: 50%;
      background: #ffcc02;
      color: #0b0b0b;
      font-size: 11px;
      font-weight: 700;
      line-height: 1;
      opacity: 0.6;
      transform: translate(-50%, -50%);
      transition: opacity .15s ease, transform .15s ease;
      z-index: 3;
    }

    .timeline-point:hover,
    .timeline-point:focus-visible {
      opacity: 1;
      transform: translate(-50%, -50%) scale(1.08);
      outline: none;
      z-index: 5;
    }

    .timeline-point.selected {
      opacity: 1;
      transform: translate(-50%, -50%) scale(1.08);
      box-shadow: 0 0 0 3px #ffcc0266;
      z-index: 4;
    }

    .tick {
      position: absolute;
      top: 64px;
      width: 1px;
      height: 12px;
      background: #333;
      transform: translateX(-50%);
    }

    .tick-label {
      position: absolute;
      top: 88px;
      font-size: 12px;
      color: #999;
      white-space: nowrap;
      transform: translateX(-50%);
    }

    .tick-label.march-label {
  transform: translateX(0);
}

    .edge-label {
      position: absolute;
      top: 118px;
      font-size: 12px;
      font-weight: 700;
      color: #ddd;
      white-space: nowrap;
    }

    .edge-label.start { left: 0; }
    .edge-label.end { right: 0; }

    .empty {
      color: #777;
      text-align: center;
      padding: 20px 0;
    }

    /* =========================
       DETAILS
    ========================= */

    #detail-panel {
      display: none;
      width: 50vw;
      max-width: 700px;
      margin: 30px auto;
      border: 1px solid #333;
      background: #141414;
      border-radius: 12px;
      padding: 20px;
      box-sizing: border-box;
      color: #f5f5f5;
    }

    #detail-date {
      margin: 0 0 6px;
      color: #ffffff;
      font-size: 20px;
      font-weight: 700;
    }

    #detail-source {
      color: #999;
      font-size: 14px;
      margin-bottom: 20px;
    }

    .event {
      margin-bottom: 20px;
      padding-bottom: 15px;
      border-bottom: 1px solid #333;
    }

    .event:last-child {
      margin-bottom: 0;
      padding-bottom: 0;
      border-bottom: none;
    }

    .event-date {
      font-weight: 700;
      color: #ffffff;
      margin-bottom: 2px;
    }

    .event strong {
      color: #ffcc02;
      font-style: italic;
    }

    .quote {
      margin-top: 8px;
      color: #ddd;
      line-height: 1.6;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }

    /* =========================
       MOBILE
    ========================= */

    @media (max-width: 600px) {
      body { padding: 50px 15px 15px; }

      .timeline-scroll,
      #detail-panel { width: 100%; }
    }
  </style>
</head>

  <h1>The Art of No Deal: A Story</h1>
  <p class="subtitle">
    Search Trump's statements on ending the Iran war by keyword
  </p>

  <div class="controls">


    <div class="slider-control" id="grouping-settings" hidden>
      <label for="group-window">Slide to adjust the grouping</label>

      <input
        type="range"
        id="group-window"
        min="0.1"
        max="3"
        step="0.1"
        value="1.2"
      >

      <div class="slider-labels">
        <span>Tighter</span>
        <span>More grouping</span>
      </div>
    </div>

    <div class="search-panel">
      <label id="keywords-label">Select one or more keywords</label>

      <div class="dropdown" id="keyword-dropdown">
        <button type="button" id="dropdown-toggle" class="dropdown-toggle"
                aria-haspopup="true" aria-expanded="false">
          <span id="dropdown-summary">Select keywords</span>
          <span class="caret">▾</span>
        </button>

        <div class="dropdown-menu" id="dropdown-menu" hidden>
          <label class="dropdown-item"><input type="checkbox" name="keyword" value="soon"> soon</label>
          <label class="dropdown-item"><input type="checkbox" name="keyword" value="quickly"> quickly</label>
          <label class="dropdown-item"><input type="checkbox" name="keyword" value="end"> end</label>
          <label class="dropdown-item"><input type="checkbox" name="keyword" value="good"> good</label>
          <label class="dropdown-item"><input type="checkbox" name="keyword" value="close"> close</label>
          <label class="dropdown-item"><input type="checkbox" name="keyword" value="shortly"> shortly</label>


          <div class="dropdown-divider"></div>

          <div class="dropdown-custom-row">
            <input type="checkbox" id="custom-checkbox" aria-label="Use custom search">
            <input
              id="custom-keyword"
              type="text"
              placeholder="Custom search..."
              autocomplete="off"
            >
          </div>
        </div>
      </div>

      <button id="search-button">Search timeline</button>
          <button type="button" id="toggle-grouping">
      Customize grouping
    </button>

    </div>

  </div>


<p id="result-count">Select one or more keywords to begin.</p>

  <div id="timeline-container"></div>

  <div id="detail-panel">
    <h2 id="detail-date"></h2>
    <div id="detail-source"></div>
    <div id="detail-quotes"></div>
  </div>

  <script src="events.js"></script>

  <script>
    const START_DATE = "2026-02-28";

    const searchButton = document.getElementById("search-button");
    const timelineContainer = document.getElementById("timeline-container");
    const resultCount = document.getElementById("result-count");
    const detailPanel = document.getElementById("detail-panel");

    const groupWindowSlider = document.getElementById("group-window");
    const groupWindowValue = document.getElementById("group-window-value");

    const toggleGroupingButton = document.getElementById("toggle-grouping");
    const groupingSettings = document.getElementById("grouping-settings");

    // Menu
    const menuButton = document.getElementById("menu-button");
    const menuPanel = document.getElementById("menu-panel");

    menuButton.onclick = () => {
      menuPanel.classList.toggle("open");
    };

    // Dropdown elements
    const keywordDropdown = document.getElementById("keyword-dropdown");
    const dropdownToggle = document.getElementById("dropdown-toggle");
    const dropdownMenu = document.getElementById("dropdown-menu");
    const dropdownSummary = document.getElementById("dropdown-summary");
    const customBox = document.getElementById("custom-checkbox");
    const customInput = document.getElementById("custom-keyword");

    // The preset keyword checkboxes (soon, art, tv, news, party)
    const keywordBoxes = Array.from(
      document.querySelectorAll('input[name="keyword"]')
    );

    let selectedPoint = null;

    /* ---------- Grouping settings toggle ---------- */

    toggleGroupingButton.addEventListener("click", function () {
      groupingSettings.hidden = !groupingSettings.hidden;

      toggleGroupingButton.textContent = groupingSettings.hidden
        ? "Customize grouping"
        : "Hide grouping settings";
    });

    /* ---------- Date helpers ---------- */

    function parseDate(dateString) {
      const parts = dateString.split("-").map(Number);
      return new Date(parts[0], parts[1] - 1, parts[2], 12);
    }

    function dateString(date) {
      const year = date.getFullYear();
      const month = String(date.getMonth() + 1).padStart(2, "0");
      const day = String(date.getDate()).padStart(2, "0");

      return `${year}-${month}-${day}`;
    }

    function formatDate(value) {
      return parseDate(value).toLocaleDateString("en-US", {
        month: "long",
        day: "numeric",
        year: "numeric"
      });
    }

    /* ---------- Keyword matching ---------- */

    function escapeRegex(text) {
      return text.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
    }

    function matchesKeyword(text, keyword) {
      if (!keyword.trim()) return false;

      const pattern = new RegExp(
        "(^|[^\\p{L}\\p{N}_])" +
        escapeRegex(keyword.trim()) +
        "($|[^\\p{L}\\p{N}_])",
        "iu"
      );

      return pattern.test(text);
    }

    /* ---------- Dropdown behavior ---------- */

    function setDropdownOpen(open) {
      dropdownMenu.hidden = !open;
      dropdownToggle.setAttribute("aria-expanded", String(open));
    }

    dropdownToggle.addEventListener("click", function () {
      setDropdownOpen(dropdownMenu.hidden);
    });

    // Close when clicking elsewhere or pressing Escape
    document.addEventListener("click", function (event) {
      if (!keywordDropdown.contains(event.target)) {
        setDropdownOpen(false);
      }
    });

    document.addEventListener("keydown", function (event) {
      if (event.key === "Escape") setDropdownOpen(false);
    });

    function updateDropdownSummary() {
      const labels = keywordBoxes
        .filter(box => box.checked)
        .map(box => box.parentElement.textContent.trim());

      const customText = customInput.value.trim();
      if (customText) labels.push('"' + customText + '"');

      dropdownSummary.textContent =
        labels.length ? labels.join(", ") : "Select keywords";
    }


    keywordBoxes.forEach(box => {
      box.addEventListener("change", function () {
        updateDropdownSummary();
        searchTimeline();
      });
    });


    // Ticking the custom box jumps into the text field;
    // unticking it clears whatever was typed.
    customBox.addEventListener("change", function () {
      if (customBox.checked) {
        customInput.focus();
      } else {
        customInput.value = "";
      }
      updateDropdownSummary();
    });

    // Clicking into the field counts as choosing it
    customInput.addEventListener("focus", function () {
      customBox.checked = true;
      updateDropdownSummary();
    });

    // Leaving it empty unticks the box again
    customInput.addEventListener("blur", function () {
      if (!customInput.value.trim()) {
        customBox.checked = false;
      }
      updateDropdownSummary();
    });

    customInput.addEventListener("input", updateDropdownSummary);

    
 // Press Enter in the custom box to search
customInput.addEventListener("keydown", function (event) {
  if (event.key === "Enter") {
    event.preventDefault();

    if (!customInput.value.trim()) return;

    customBox.checked = true;
    updateDropdownSummary();
    setDropdownOpen(false);
    searchTimeline();
  }
});


    function getKeywords() {
      const keywords = keywordBoxes
        .filter(box => box.checked)
        .map(box => box.value);

      if (customBox.checked && customInput.value.trim()) {
        keywords.push(customInput.value.trim());
      }

      // Remove case-insensitive duplicates
      return [
        ...new Map(
          keywords.map(keyword => [keyword.toLowerCase(), keyword])
        ).values()
      ];
    }

    /* ---------- Timeline rendering ---------- */

    function renderTimeline(matchingEvents) {
      timelineContainer.replaceChildren();
      detailPanel.style.display = "none";
      selectedPoint = null;

      const start = parseDate(START_DATE);

      // Today's local date, calculated automatically.
      const today = new Date();
      today.setHours(12, 0, 0, 0);

      const end = today;
      const startTime = start.getTime();
      const endTime = end.getTime();
      const duration = endTime - startTime;

      if (duration <= 0) {
        timelineContainer.className = "empty";
        timelineContainer.textContent =
          "The timeline end date must be after February 28, 2026.";
        return;
      }

      // Keep only records within the timeline's date range.
      const datedEvents = matchingEvents.filter(event => {
        if (!event.date || !/^\d{4}-\d{2}-\d{2}$/.test(event.date)) {
          return false;
        }

        const time = parseDate(event.date).getTime();
        return time >= startTime && time <= endTime;
      });

      if (datedEvents.length === 0) {
        timelineContainer.className = "empty";
        timelineContainer.textContent =
          "No matching records fall within the timeline dates.";
        return;
      }

      timelineContainer.className = "timeline-scroll";

      const timeline = document.createElement("div");
      timeline.className = "timeline";

      const line = document.createElement("div");
      line.className = "timeline-line";
      timeline.appendChild(line);

      function positionFor(date) {
        return (
          (parseDate(date).getTime() - startTime) /
          duration * 100
        );
      }

      // Add monthly tick marks.
      const firstMonth = new Date(
        start.getFullYear(),
        start.getMonth() + 1,
        1,
        12
      );

      for (
        let date = firstMonth;
        date < end;
        date = new Date(
          date.getFullYear(),
          date.getMonth() + 1,
          1,
          12
        )
      ) {
        const position = positionFor(dateString(date));

        const tick = document.createElement("div");
        tick.className = "tick";
        tick.style.left = position + "%";
        timeline.appendChild(tick);

        const label = document.createElement("div");
label.className = "tick-label";

if (date.getMonth() === 2) {
  label.classList.add("march-label");
}        label.style.left = position + "%";
        label.textContent = date.toLocaleDateString("en-US", {
          month: "short"
        });
        timeline.appendChild(label);
      }

      // Sort events by date before grouping nearby dates.
      const sortedEvents = [...datedEvents].sort((a, b) =>
        a.date.localeCompare(b.date)
      );

      // Group nearby events together.
      const GROUP_WINDOW_PERCENT = Number(groupWindowSlider.value);

      const groups = [];

      for (const event of sortedEvents) {
        const position = positionFor(event.date);
        const lastGroup = groups[groups.length - 1];

        if (
          lastGroup &&
          (position - lastGroup.lastPosition) <= GROUP_WINDOW_PERCENT
        ) {
          lastGroup.events.push(event);
          lastGroup.lastPosition = position;
          lastGroup.position =
            (lastGroup.position * (lastGroup.events.length - 1) +
              position) / lastGroup.events.length;
        } else {
          groups.push({
            events: [event],
            position: position,
            lastPosition: position
          });
        }
      }

      // Draw one dot per group.
      for (const group of groups) {
        const count = group.events.length;
        const point = document.createElement("button");

        point.className = "timeline-point";
        point.type = "button";

        // Larger groups get larger dots.
        const diameter = Math.min(12 + Math.sqrt(count - 1) * 8, 48);

        point.style.width = diameter + "px";
        point.style.height = diameter + "px";
        point.style.left = group.position + "%";
        point.style.top = "70px";

        // Put the number inside groups containing multiple quotes.
        point.textContent = count > 1 ? count : "";

        point.title =
          count + (count === 1 ? " matching quote" : " matching quotes");

        point.setAttribute(
          "aria-label",
          count + (count === 1 ? " matching quote" : " matching quotes")
        );

        point.addEventListener("click", function () {
          showGroupDetails(group.events, point);
        });

        timeline.appendChild(point);
      }

      // Fixed beginning and today's endpoint.
      const startLabel = document.createElement("div");
      startLabel.className = "edge-label start";
      startLabel.textContent = "";
      timeline.appendChild(startLabel);

      const endLabel = document.createElement("div");
      endLabel.className = "edge-label end";
      endLabel.textContent = "Today · " + end.toLocaleDateString("en-US", {
        month: "short",
        day: "numeric",
        year: "numeric"
      });
      timeline.appendChild(endLabel);

      timelineContainer.appendChild(timeline);
    }

    /* ---------- Detail panel ---------- */

    function showGroupDetails(groupEvents, point) {
      if (selectedPoint) {
        selectedPoint.classList.remove("selected");
      }

      selectedPoint = point;
      selectedPoint.classList.add("selected");

      const dateElement = document.getElementById("detail-date");
      const sourceElement = document.getElementById("detail-source");
      const quotesElement = document.getElementById("detail-quotes");

      const firstDate = groupEvents[0].date;
      const lastDate = groupEvents[groupEvents.length - 1].date;

      dateElement.textContent =
        firstDate === lastDate
          ? formatDate(firstDate)
          : formatDate(firstDate) + " – " + formatDate(lastDate);

      sourceElement.textContent =
        groupEvents.length + (groupEvents.length === 1
          ? " matching quote"
          : " matching quotes");

      quotesElement.replaceChildren();

      for (const event of groupEvents) {
        const item = document.createElement("div");
        item.className = "event";

        const date = document.createElement("div");
        date.className = "event-date";
        date.textContent = formatDate(event.date);

        const source = document.createElement("strong");
        source.textContent = event.source || "Unknown source";

        const quote = document.createElement("div");
        quote.className = "quote";
        quote.textContent = '"' + (event.quote || "") + '"';

        item.appendChild(date);
        item.appendChild(source);
        item.appendChild(quote);
        quotesElement.appendChild(item);
      }

      detailPanel.style.display = "block";
      detailPanel.scrollIntoView({
        behavior: "smooth",
        block: "nearest"
      });
    }

    /* ---------- Search ---------- */

    function searchTimeline() {
      const keywords = getKeywords();

      if (keywords.length === 0) {
        resultCount.textContent = "Select at least one keyword.";
        timelineContainer.replaceChildren();
        timelineContainer.className = "";
        detailPanel.style.display = "none";
        return;
      }

      const matchingEvents = events
        .filter(event =>
          keywords.some(keyword =>
            matchesKeyword(event.quote || "", keyword)
          )
        )
        .sort((a, b) => (a.date || "").localeCompare(b.date || ""));

      const start = parseDate(START_DATE);
      const today = new Date();
      today.setHours(12, 0, 0, 0);

      const inRange = matchingEvents.filter(event => {
        if (!event.date || !/^\d{4}-\d{2}-\d{2}$/.test(event.date)) {
          return false;
        }

        const time = parseDate(event.date).getTime();
        return time >= start.getTime() && time <= today.getTime();
      });

      resultCount.textContent =
        inRange.length + (inRange.length === 1
          ? " matching record on the timeline"
          : " matching records on the timeline");

      renderTimeline(matchingEvents);
    }

    searchButton.addEventListener("click", searchTimeline);

    groupWindowSlider.addEventListener("input", function () {
  // Refresh the timeline using the current search selection.
  if (getKeywords().length > 0) searchTimeline();
});
  </script>
</body>
</html>
